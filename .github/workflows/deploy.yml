name: Deploy to Railway

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  packages: read

concurrency:
  group: railway-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.RAILWAY_PUBLIC_URL }}
    env:
      RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PUBLIC_URL: ${{ vars.RAILWAY_PUBLIC_URL }}
    steps:
      - name: Validate deployment configuration
        run: |
          test -n "$RAILWAY_TOKEN" || {
            echo "The production RAILWAY_TOKEN secret is required."
            exit 1
          }
          test -n "$RAILWAY_SERVICE" || {
            echo "The production RAILWAY_SERVICE variable is required."
            exit 1
          }
          test -n "$RAILWAY_PUBLIC_URL" || {
            echo "The production RAILWAY_PUBLIC_URL variable is required."
            exit 1
          }

      - name: Read current Railway deployment
        id: before
        run: |
          deployments="$(
            docker run --rm \
              -e RAILWAY_TOKEN \
              ghcr.io/railwayapp/cli:latest \
              railway \
              deployment list \
              --service "$RAILWAY_SERVICE" \
              --limit 1 \
              --json
          )"
          deployment_id="$(
            jq -r '
              if type == "array" then
                .[0].id // ""
              else
                .deployments[0].id // ""
              end
            ' <<<"$deployments"
          )"
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"

      - name: Trigger Railway deployment
        run: |
          docker run --rm \
            -e RAILWAY_TOKEN \
            ghcr.io/railwayapp/cli:latest \
            railway \
            redeploy \
            --service "$RAILWAY_SERVICE" \
            --yes

      - name: Wait for the new deployment
        env:
          PREVIOUS_DEPLOYMENT_ID: ${{ steps.before.outputs.deployment_id }}
        run: |
          for _ in {1..60}; do
            deployments="$(
              docker run --rm \
                -e RAILWAY_TOKEN \
                ghcr.io/railwayapp/cli:latest \
                railway \
                deployment list \
                --service "$RAILWAY_SERVICE" \
                --limit 1 \
                --json
            )"
            deployment_id="$(
              jq -r '
                if type == "array" then
                  .[0].id // ""
                else
                  .deployments[0].id // ""
                end
              ' <<<"$deployments"
            )"
            status="$(
              jq -r '
                if type == "array" then
                  .[0].status // ""
                else
                  .deployments[0].status // ""
                end
              ' <<<"$deployments"
            )"

            echo "Railway deployment ${deployment_id:-pending}: ${status:-pending}"

            if [[ -n "$deployment_id" && "$deployment_id" != "$PREVIOUS_DEPLOYMENT_ID" ]]; then
              case "$status" in
                SUCCESS)
                  exit 0
                  ;;
                FAILED|CRASHED|REMOVED)
                  echo "Railway deployment failed with status $status."
                  exit 1
                  ;;
              esac
            fi

            sleep 10
          done

          echo "Timed out waiting for Railway deployment."
          exit 1

      - name: Verify production health
        run: |
          health_url="${RAILWAY_PUBLIC_URL%/}/health/live"
          for _ in {1..12}; do
            if curl --fail --silent --show-error "$health_url"; then
              echo
              echo "Production health check passed: $health_url"
              exit 0
            fi
            sleep 10
          done

          echo "Production health check failed: $health_url"
          exit 1
