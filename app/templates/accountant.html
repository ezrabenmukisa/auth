<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Accountant Dashboard</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 800px; margin: 30px auto; padding: 0 16px; color: #1a1a1a; }
  h1 { font-size: 1.4rem; }
  h2 { font-size: 1.1rem; margin-top: 2rem; border-bottom: 1px solid #ddd; padding-bottom: 6px; }
  input, button { padding: 6px 8px; margin: 4px 4px 4px 0; font-size: 0.9rem; }
  button { cursor: pointer; background: #1a1a1a; color: white; border: none; border-radius: 4px; padding: 6px 12px; }
  button:hover { background: #333; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 0.9rem; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #eee; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
  #token { width: 420px; }
  .msg { font-size: 0.85rem; color: #b00; margin-top: 4px; min-height: 1em; }
  .note { font-size: 0.8rem; color: #666; }
</style>
</head>
<body>

<h1>Accountant Dashboard</h1>
<p class="note">Your role only has <code>permissions.read</code> in the seed data, so this is the one thing you can view — no roles list, no editing.</p>

<section>
  <h2>Connection</h2>
  <div class="row">
    <label>API base: <input id="apiBase" value="http://localhost:5000/api/v1/authorization" size="42"></label>
  </div>
  <div class="row">
    <label>Access token: <input id="token" placeholder="paste JWT access token here"></label>
  </div>
</section>

<section>
  <h2>Permissions</h2>
  <div class="row">
    <button onclick="loadPermissions()">Refresh</button>
  </div>
  <table id="permissionsTable">
    <thead><tr><th>ID</th><th>Name</th><th>Description</th></tr></thead>
    <tbody></tbody>
  </table>
  <div id="permissionsMsg" class="msg"></div>
</section>

<script>
function base() { return document.getElementById('apiBase').value.replace(/\/$/, ''); }
function authHeaders() {
  return {
    'Content-Type': 'application/json',
    'Authorization': 'Bearer ' + document.getElementById('token').value.trim()
  };
}
function extractError(body) {
  if (!body) return 'Request failed';
  if (body.error) return body.error;
  if (body.errors) return Object.values(body.errors).join(', ');
  return 'Request failed';
}
async function call(path, options = {}) {
  const res = await fetch(base() + path, { ...options, headers: authHeaders() });
  let body = null;
  try { body = await res.json(); } catch (e) {}
  if (!res.ok) throw new Error(extractError(body));
  return body;
}

async function loadPermissions() {
  const msg = document.getElementById('permissionsMsg');
  msg.textContent = '';
  try {
    const perms = await call('/permissions');
    const tbody = document.querySelector('#permissionsTable tbody');
    tbody.innerHTML = '';
    perms.forEach(p => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${p.id}</td><td>${p.name}</td><td>${p.description || ''}</td>`;
      tbody.appendChild(tr);
    });
  } catch (e) { msg.textContent = e.message; }
}

loadPermissions();
</script>
</body>
</html>
