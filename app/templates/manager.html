<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Manager Dashboard</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 900px; margin: 30px auto; padding: 0 16px; color: #1a1a1a; }
  h1 { font-size: 1.4rem; }
  h2 { font-size: 1.1rem; margin-top: 2rem; border-bottom: 1px solid #ddd; padding-bottom: 6px; }
  section { margin-bottom: 28px; }
  input, button { padding: 6px 8px; margin: 4px 4px 4px 0; font-size: 0.9rem; }
  button { cursor: pointer; background: #1a1a1a; color: white; border: none; border-radius: 4px; padding: 6px 12px; }
  button:hover { background: #333; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 0.9rem; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #eee; vertical-align: top; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
  #token { width: 420px; }
  .msg { font-size: 0.85rem; color: #b00; margin-top: 4px; min-height: 1em; }
  .pill { display: inline-block; background: #eee; border-radius: 10px; padding: 2px 8px; margin: 2px; font-size: 0.8rem; }
  .note { font-size: 0.8rem; color: #666; }
</style>
</head>
<body>

<h1>Manager Dashboard</h1>
<p class="note">Your role has <code>roles.read</code> and <code>permissions.read</code> — this view is read-only by design; there's nothing here to create, edit, or delete.</p>

<section>
  <h2>Connection</h2>
  <div class="row">
    <label>API base: <input id="apiBase" value="http://localhost:5000/api/v1/authorization" size="42"></label>
  </div>
  <div class="row">
    <label>Access token: <input id="token" placeholder="paste JWT access token here"></label>
  </div>
</section>

<section>
  <h2>Roles</h2>
  <div class="row">
    <button onclick="loadRoles()">Refresh</button>
  </div>
  <table id="rolesTable">
    <thead><tr><th>ID</th><th>Name</th><th>Description</th><th></th></tr></thead>
    <tbody></tbody>
  </table>
  <div id="rolesMsg" class="msg"></div>

  <div id="rolePermissionsView" style="display:none; margin-top:10px;">
    <strong>Permissions for role <span id="rpLabel"></span></strong>
    <div id="rpList"></div>
  </div>
</section>

<section>
  <h2>Permissions</h2>
  <div class="row">
    <button onclick="loadPermissions()">Refresh</button>
  </div>
  <table id="permissionsTable">
    <thead><tr><th>ID</th><th>Name</th><th>Description</th></tr></thead>
    <tbody></tbody>
  </table>
  <div id="permissionsMsg" class="msg"></div>
</section>

<script>
function base() { return document.getElementById('apiBase').value.replace(/\/$/, ''); }
function authHeaders() {
  return {
    'Content-Type': 'application/json',
    'Authorization': 'Bearer ' + document.getElementById('token').value.trim()
  };
}
function extractError(body) {
  if (!body) return 'Request failed';
  if (body.error) return body.error;
  if (body.errors) return Object.values(body.errors).join(', ');
  return 'Request failed';
}
async function call(path, options = {}) {
  const res = await fetch(base() + path, { ...options, headers: authHeaders() });
  let body = null;
  try { body = await res.json(); } catch (e) {}
  if (!res.ok) throw new Error(extractError(body));
  return body;
}

async function loadRoles() {
  const msg = document.getElementById('rolesMsg');
  msg.textContent = '';
  try {
    const roles = await call('/roles');
    const tbody = document.querySelector('#rolesTable tbody');
    tbody.innerHTML = '';
    roles.forEach(r => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${r.id}</td><td>${r.name}</td><td>${r.description || ''}</td>
        <td><button onclick="viewRolePermissions(${r.id}, ${JSON.stringify(r.name)})">View permissions</button></td>`;
      tbody.appendChild(tr);
    });
  } catch (e) { msg.textContent = e.message; }
}

async function viewRolePermissions(roleId, roleName) {
  const msg = document.getElementById('rolesMsg');
  try {
    const permissions = await call(`/roles/${roleId}/permissions`);
    document.getElementById('rolePermissionsView').style.display = 'block';
    document.getElementById('rpLabel').textContent = `#${roleId} (${roleName})`;
    const list = document.getElementById('rpList');
    list.innerHTML = permissions.length
      ? permissions.map(p => `<span class="pill">${p.name}</span>`).join('')
      : '<em>No permissions assigned.</em>';
  } catch (e) { msg.textContent = e.message; }
}

async function loadPermissions() {
  const msg = document.getElementById('permissionsMsg');
  msg.textContent = '';
  try {
    const perms = await call('/permissions');
    const tbody = document.querySelector('#permissionsTable tbody');
    tbody.innerHTML = '';
    perms.forEach(p => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${p.id}</td><td>${p.name}</td><td>${p.description || ''}</td>`;
      tbody.appendChild(tr);
    });
  } catch (e) { msg.textContent = e.message; }
}

loadRoles();
loadPermissions();
</script>
</body>
</html>
