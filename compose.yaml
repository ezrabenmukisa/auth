x-app-environment: &app-environment
  SECRET_KEY: "${SECRET_KEY:?Set SECRET_KEY in .env}"
  JWT_SECRET_KEY: "${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}"
  JWT_ACCESS_TOKEN_MINUTES: "${JWT_ACCESS_TOKEN_MINUTES:-15}"
  JWT_REFRESH_TOKEN_DAYS: "${JWT_REFRESH_TOKEN_DAYS:-30}"
  DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-auth}:${POSTGRES_PASSWORD:-auth-development-password}@db:5432/${POSTGRES_DB:-auth}"
  MAIL_SERVER: "${MAIL_SERVER:-smtp.gmail.com}"
  MAIL_PORT: "${MAIL_PORT:-465}"
  MAIL_USE_SSL: "${MAIL_USE_SSL:-true}"
  MAIL_USERNAME: "${MAIL_USERNAME:-}"
  MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
  MAIL_DEFAULT_SENDER: "${MAIL_DEFAULT_SENDER:-}"
  PUBLIC_APP_URL: "${PUBLIC_APP_URL:-http://localhost:5001}"

services:
  web:
    build:
      context: .
    ports:
      - "${APP_PORT:-5001}:5000"
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  migrate:
    build:
      context: .
    command: ["flask", "db", "upgrade"]
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-auth}"
      POSTGRES_USER: "${POSTGRES_USER:-auth}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-auth-development-password}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U ${POSTGRES_USER:-auth} -d ${POSTGRES_DB:-auth}"
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
